<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>omokage 独自 UI の例</title>
<style>
  :root { font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif; color: #1f2430; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #f3f5f8; }
  main { max-width: 980px; margin: 24px auto; padding: 0 16px; display: grid; grid-template-columns: 280px 1fr; gap: 16px; align-items: start; }
  .card { background: #fff; border-radius: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.06); padding: 16px; }
  .side { position: sticky; top: 16px; display: grid; gap: 10px; }
  #preview { aspect-ratio: 1; border-radius: 22%; overflow: hidden; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  button, select { font: inherit; font-size: 13px; padding: 7px 12px; border-radius: 8px; border: 1px solid #d5dae3; background: #fff; cursor: pointer; }
  button.pri { background: #1f2430; color: #fff; border-color: #1f2430; }
  button:disabled { opacity: .4; cursor: default; }
  .panel { height: 640px; display: grid; grid-template-rows: auto auto 1fr; gap: 12px; }
  .tabs button.on { background: #1f2430; color: #fff; border-color: #1f2430; }
  .scroll { overflow-y: auto; scrollbar-gutter: stable; }
  h3 { font-size: 13px; margin: 14px 0 8px; color: #6b7385; }
  .parts { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 6px; }
  .parts button { padding: 3px; border-width: 2px; border-color: transparent; background: #f3f5f8; font-size: 11px; }
  .parts button.on { border-color: #1f2430; background: #fff; }
  .parts svg { width: 100%; height: auto; display: block; border-radius: 8px; }
  .sw { width: 24px; height: 24px; padding: 0; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px #d5dae3; }
  .sw.on { box-shadow: 0 0 0 2px #1f2430; }
  pre { margin: 0; font-size: 11px; background: #1f2430; color: #d8dee9; padding: 10px; border-radius: 8px; max-height: 160px; overflow: auto; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } .side { position: static; } .panel { height: auto; } }
</style>
</head>
<body>
<main>
  <div class="card side">
    <div id="preview"></div>
    <div class="row"><select id="style"></select><button id="undo">元に戻す</button><button id="redo">やり直す</button></div>
    <div class="row"><button id="shuffle">おまかせ</button><button id="revert">最初に戻す</button><button class="pri" id="save">保存</button></div>
    <pre id="out"></pre>
  </div>
  <div class="card panel">
    <div class="row tabs" id="groups"></div>
    <div class="row tabs" id="cats"></div>
    <div class="scroll" id="body"></div>
  </div>
</main>

<script type="module">
// A customizer UI built from the model layer only:
//   catalog  — what to offer (categories, parts, swatches) as plain data
//   editor   — state and actions; we just redraw on every change
import { createEditor, validate } from "../dist/omokage.esm.js";

const editor = createEditor({ value: { style: "animals", config: { ears: "usagi" } }, seed: "akamine" });
const $ = (id) => document.getElementById(id);
let group = 0, cat = null;

function draw() {
  const state = editor.getState(), C = editor.catalog();
  if (!C.categories.some((c) => c.key === cat)) { group = 0; cat = C.groups[0].categories[0]; }
  const category = C.categories.find((c) => c.key === cat);

  $("preview").innerHTML = editor.preview();
  $("style").innerHTML = editor.styles().map((s) => `<option value="${s.key}" ${s.key === state.style ? "selected" : ""}>${s.label}</option>`).join("");
  $("undo").disabled = !state.canUndo;
  $("redo").disabled = !state.canRedo;
  $("out").textContent = JSON.stringify(editor.value(), null, 1);

  $("groups").innerHTML = C.groups.map((g, i) => `<button class="${i === group ? "on" : ""}" data-g="${i}">${g.label}</button>`).join("");
  $("cats").innerHTML = C.groups[group].categories.map((k) => `<button class="${k === cat ? "on" : ""}" data-c="${k}">${C.categories.find((c) => c.key === k).label}</button>`).join("");

  const top = $("body").scrollTop;
  $("body").innerHTML =
    category.colors.map((slot) => `<h3>${slot.label}</h3><div class="row">${slot.swatches.map((sw) =>
      `<button class="sw ${editor.color(slot.key).value === sw.value ? "on" : ""}" style="background:${sw.hex}" title="${sw.name}" data-key="${slot.key}" data-value="${sw.value}"></button>`).join("")}</div>`).join("") +
    (category.parts.length ? `<h3>${category.label}</h3><div class="parts">${category.parts.map((p) =>
      `<button class="${editor.isSelected(cat, p.id) ? "on" : ""}" data-part="${p.id}">${editor.thumbnail(cat, p.id)}${p.label}</button>`).join("")}</div>` : "");
  $("body").scrollTop = top;
}

editor.subscribe(draw);
document.addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.g) { group = +b.dataset.g; cat = editor.catalog().groups[group].categories[0]; return draw(); }
  if (b.dataset.c) { cat = b.dataset.c; return draw(); }
  if (b.dataset.part) return editor.select(cat, b.dataset.part);
  if (b.dataset.key) return editor.setColor(b.dataset.key, b.dataset.value);
  if (b.id === "undo") editor.undo();
  if (b.id === "redo") editor.redo();
  if (b.id === "shuffle") editor.randomize();
  if (b.id === "revert") editor.revert();
  if (b.id === "save") {
    const { ok, value, errors } = validate(editor.value());   // what the server should do too
    alert(ok ? `保存します:\n${JSON.stringify(value)}` : errors.join("\n"));
  }
});
$("style").onchange = (e) => editor.setStyle(e.target.value);
draw();
</script>
</body>
</html>

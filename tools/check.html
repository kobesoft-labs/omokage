<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>組み合わせチェック</title>
<style>
  body { margin: 0; padding: 20px; font-family: system-ui, "Hiragino Sans", sans-serif; background: #faf8fc; color: #2b2233; }
  h1 { font-size: 18px; margin: 0 0 6px; }
  nav { font-size: 13px; margin-bottom: 12px; display: flex; gap: 12px; flex-wrap: wrap; }
  nav a { color: #6b4fd8; }
  table { border-collapse: collapse; }
  th { font-size: 11px; font-weight: 500; padding: 2px 4px; white-space: nowrap; }
  th.r { text-align: right; }
  td { padding: 2px; }
  td svg { width: 110px; height: 110px; display: block; border-radius: 10px; }
  td.w svg { width: 150px; height: 75px; }
</style>
</head>
<body>
<h1 id="h"></h1>
<nav>
  <a href="?">帽子 × 髪型</a>
  <a href="?mode=top">服 × 首まわり</a>
  <a href="?mode=topHair">服 × 髪型</a>
  <a href="audit.html">はみ出し自動チェック</a>
</nav>
<table id="t"></table>
<script type="module">
import { Officers } from "../src/index.js";
const O = Officers, q = new URLSearchParams(location.search);
const mode = q.get("mode") || "hat";
const T = document.getElementById("t");
const grid = (rows, cols, cfg, view, cls = "") =>
  `<tr><th></th>${cols.map(c => `<th>${c.label}</th>`).join("")}</tr>` +
  rows.map(r => `<tr><th class="r">${r.label}</th>${cols.map(c => `<td class="${cls}">${O.render(cfg(r, c), { viewBox: view })}</td>`).join("")}</tr>`).join("");

if (mode === "hat"){
  // ?g=0〜3 で髪型を 7 個ずつに分けて表示（省略時は全部）
  document.getElementById("h").textContent = "帽子 × 髪型";
  const g = q.get("g");
  const hairs = g === null ? O.PARTS.hair : O.PARTS.hair.slice(+g * 7, +g * 7 + 7);
  const base = { top: "tshirt", topColor: "theme", hairColor: "#4b3428", hatColor: "#e8833a", hatColor2: "#2b2233" };
  T.innerHTML = grid(O.PARTS.hat.filter(h => h.id !== "none"), hairs, (hat, h) => ({ ...base, hair: h.id, hat: hat.id }), "20 0 160 160");
}
if (mode === "top"){
  // 重なりの崩れが目立つよう、メイン・サブ・首まわりをはっきり違う色にする
  document.getElementById("h").textContent = "服 × 首まわり（メイン=紺 / サブ=黄 / 首まわり=赤）";
  const base = { hair: "side", topColor: "#2f4a8a", topColor2: "#f2c94c", neckColor: "#d94a4a", neckColor2: "#4fae6a", chestColor: "#d94a4a" };
  T.innerHTML = grid(O.PARTS.top, O.PARTS.neck, (t, n) => ({ ...base, top: t.id, neck: n.id }), "40 110 120 90", "w");
}
if (mode === "topHair"){
  document.getElementById("h").textContent = "服 × 髪型（肩にかかる髪・アフロ・長いひげ）";
  const cols = [["long", "長い髪"], ["longWavy", "ウェーブ"], ["twintails", "ツインテール"], ["braid", "三つ編み"], ["afro", "アフロ"], ["side", "長いひげ"]].map(([id, label]) => ({ id, label }));
  const base = { topColor: "#2f4a8a", topColor2: "#f2c94c", hairColor: "#7c4e30" };
  T.innerHTML = grid(O.PARTS.top, cols, (t, c) => ({ ...base, top: t.id, hair: c.id, beard: c.label === "長いひげ" ? "longBeard" : "none" }), "20 60 160 140");
}
</script>
</body>
</html>
